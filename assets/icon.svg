<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090D"/>
      <stop offset="100%" stop-color="#11131A"/>
    </linearGradient>
    
    <!-- Accent Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02FEDC"/>
      <stop offset="50%" stop-color="#5A5CFF"/>
      <stop offset="100%" stop-color="#F502FD"/>
    </linearGradient>
    
    <!-- Core Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171A23"/>
      <stop offset="100%" stop-color="#0D0F15"/>
    </linearGradient>
  </defs>

  <!-- Base App Icon Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1E2230" stroke-width="3"/>

  <!-- Futuristic Geometric Shield / Hexagon -->
  <path d="M 256,68 L 406,144 L 406,306 C 406,380 342,434 256,456 C 170,434 106,380 106,306 L 106,144 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#brandGrad)" 
        stroke-width="5"
        filter="url(#glow)"/>

  <!-- Stylized "N" Core Energy Symbol -->
  <!-- Left Pillar -->
  <path d="M 184,176 L 220,176 L 220,336 L 184,336 Z" fill="#02FEDC" />
  
  <!-- Right Pillar -->
  <path d="M 292,176 L 328,176 L 328,336 L 292,336 Z" fill="#F502FD" />

  <!-- Dynamic Diagonal Connector with Electric Mint to Magenta Transition -->
  <path d="M 184,176 L 230,176 L 328,336 L 282,336 Z" fill="url(#brandGrad)" />

  <!-- Center Core Orbit Ring / Pulse -->
  <circle cx="256" cy="256" r="28" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.9" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="10" fill="#02FEDC"/>
</svg>
