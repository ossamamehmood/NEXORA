<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBrandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#02FEDC"/>
      <stop offset="50%" stop-color="#5A5CFF"/>
      <stop offset="100%" stop-color="#F502FD"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Mark on Left -->
  <g transform="translate(40, 20) scale(0.31)">
    <rect width="512" height="512" rx="100" fill="#11131A" stroke="#1E2230" stroke-width="6"/>
    <path d="M 256,68 L 406,144 L 406,306 C 406,380 342,434 256,456 C 170,434 106,380 106,306 L 106,144 Z" 
          fill="#171A23" stroke="url(#logoBrandGrad)" stroke-width="8" filter="url(#logoGlow)"/>
    <path d="M 184,176 L 220,176 L 220,336 L 184,336 Z" fill="#02FEDC" />
    <path d="M 292,176 L 328,176 L 328,336 L 292,336 Z" fill="#F502FD" />
    <path d="M 184,176 L 230,176 L 328,336 L 282,336 Z" fill="url(#logoBrandGrad)" />
    <circle cx="256" cy="256" r="24" fill="none" stroke="#FFFFFF" stroke-width="5" filter="url(#logoGlow)"/>
    <circle cx="256" cy="256" r="9" fill="#02FEDC"/>
  </g>

  <!-- Wordmark "NEXORA" -->
  <text x="240" y="115" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="78" font-weight="900" letter-spacing="4" fill="#F5F7FA">
    NEX<tspan fill="url(#logoBrandGrad)">ORA</tspan>
  </text>

  <!-- Tagline -->
  <text x="244" y="152" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="19" font-weight="500" letter-spacing="1.5" fill="#969BAA">
    YOUR SYSTEM. UNDER CONTROL.
  </text>
</svg>
