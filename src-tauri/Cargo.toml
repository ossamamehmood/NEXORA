[package]
name = "nexora"
version = "1.0.0-rc.1"
description = "NEXORA - PC Cleaner, Privacy Manager & System Maintenance Suite (Release Candidate)"
authors = ["NEXORA Engineering Team"]
edition = "2021"

[lib]
name = "nexora_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
walkdir = "2.4"
sha2 = "0.10"
uuid = { version = "1.6", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
winreg = "0.52"

[dev-dependencies]
tempfile = "3.8"
